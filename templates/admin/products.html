{% include './company_profile.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products and Services</title>
    <style>
        body {
            position: relative;
            background-color: #ffff;
            font-family: "Agency FB";
            overflow-y: scroll; /* Allows scrolling */
            scrollbar-width: none !important; /* Firefox */
            -ms-overflow-style: none !important; /* Internet Explorer 10+ */
        }

        /* For Chrome, Safari, and Edge */
        body::-webkit-scrollbar {
            display: none !important; 
            width: 0px;
            background: transparent; /* Optional: makes scrollbar background transparent */
        }
        .main-content {
            margin-left: 290px;
            padding: 40px;
            transition: margin-left 0.3s;
            height: calc(100vh);
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .main-content::-webkit-scrollbar {
            display: none;
            width: 0px;
            background: transparent;
        }

        .container {
            max-width: 80%;
            padding: 30px;
        }

        .plus-button {
            font-size: 5rem;
            color: black;
            text-align: center;
            cursor: pointer;
            display: block;
            margin: 100px auto;
        }
        .small-plus-button {
            top: 0;
            font-size: 2rem;
            color: black;
            text-align: center;
            cursor: pointer;
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
        }
        .entry-form, .product-list {
            display: none;
        }
        .product-card {
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .product-header {
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: grey;
        }
        .product-name {
            font-weight: bold;
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: black;
        }
        .section-title {
            color: grey;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 2px; /* Small gap between label and data */
        }
        .form-control {
            border: none;
            border-bottom: 1px solid grey;
            border-radius: 0;
            width: 100%;
            padding-left: 0;
            margin-bottom: 0.5rem;
            background-color: white !important;
            transition: background-color 0s;
        }
        .form-control:focus {
            background-color: white !important;
            box-shadow: none;
            outline: none;
        }
        .card-buttons {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .delete-button, .edit-button {
            margin-left: 10px;
        }
        .submit-button {
            position: relative;
            display: block;
            margin-top: 20px;
            margin-left: auto;
        }
        .divider {
            border-top: 1px solid grey;
            margin: 10px 0;
        }
        .inline-inputs {
            display: flex;
            align-items: center;
        }
        .inline-inputs label {
            margin-right: 5px;
        }
        .inline-inputs input {
            width: 150px;
            margin-right: 5px;
        }
        .form-container {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
        }
        .form-column {
            flex: 1;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
        }
        .form-column:last-child {
            margin-right: 0;
        }
        .form-column > .form-group {
            flex: 1;
        }
        .product-card p {
            margin-top: -5px; /* Small gap between label and data */
            margin-bottom: 20px; /* Regular gap between different fields */
            line-height: 2.2; /* Adjusts the line height for better readability */
        }
    </style>
</head>
<body>
    <div class="container mt-4 main-content">
        <div id="plusButton" class="plus-button" onclick="showForm()">+</div>
        <div id="smallPlusButton" class="small-plus-button" onclick="showForm()">+</div>

        <form id="productForm">
            <div id="entryForm" class="entry-form">
                <div class="form-container">
                    <div class="form-column">
                        <div class="form-group">
                            <label for="productTitle" class="form-label section-title">Product Title</label>
                            <input type="text" class="form-control" id="productTitle" name="productTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="description" class="form-label section-title">Description</label>
                            <textarea class="form-control" id="description" rows="3" name="description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="industry" class="form-label section-title">Industry / Sector</label>
                            <input type="text" class="form-control" id="industry" name="industry" required>
                        </div>
                        <div class="form-group">
                            <label for="businessType" class="form-label section-title">Type of Business</label>
                            <input type="text" class="form-control" id="businessType" name="businessType" required>
                        </div>
                        <div class="form-group">
                            <label for="problemsSolved" class="form-label section-title">Problems Solved</label>
                            <input type="text" class="form-control" id="problemsSolved" name="problemsSolved" required>
                        </div>
                    </div>
                    <div class="form-column">
                        <div class="form-group">
                            <label for="launchDate" class="form-label section-title">Launch Date</label>
                            <input type="date" class="form-control" id="launchDate" name="launchDate" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label section-title">Three Year Revenue & Profit</label>
                            <div class="inline-inputs">
                                <label>Current Year (YTD):</label>
                            </div>
                            <div class="inline-inputs">
                                <label>Revenue = </label>
                                <input type="text" class="form-control" id="revenueCurrentYear" name="revenueCurrentYear" required>
                                <label>| P/L =</label>
                                <input type="text" class="form-control" id="profitCurrentYear" name="profitCurrentYear" required>
                            </div>
                            <div class="inline-inputs">
                                <label>Previous Year:</label>
                            </div>
                            <div class="inline-inputs">
                                <label>Revenue = </label>
                                <input type="text" class="form-control" id="revenuePreviousYear" name="revenuePreviousYear" required>
                                <label>| P/L =</label>
                                <input type="text" class="form-control" id="profitPreviousYear" name="profitPreviousYear" required>
                            </div>
                            <div class="inline-inputs">
                                <label>A year before:</label>
                            </div>
                            <div class="inline-inputs">
                                <label>Revenue = </label>
                                <input type="text" class="form-control" id="revenueYearBefore" name="revenueYearBefore" required>
                                <label>| P/L =</label>
                                <input type="text" class="form-control" id="profitYearBefore" name="profitYearBefore" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="customers" class="form-label section-title">Customers</label>
                            <input type="text" class="form-control" id="customers" name="customers" required>
                        </div>
                        <div class="form-group">
                            <label for="competitors" class="form-label section-title">Competitors</label>
                            <input type="text" class="form-control" id="competitors" name="competitors" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary submit-button">Add Product</button>
            </div>
        </form>

        <div id="productList" class="product-list"></div>
    </div>

    <script>
        let products = [];

        document.addEventListener('DOMContentLoaded', function () {
            const productForm = document.getElementById('productForm');
        
            // Ensure the form exists before attaching the event listener
            if (!productForm) {
                console.error("Form element not found.");
                return;
            }
        
            // Handle form submission
            productForm.addEventListener('submit', function (event) {
                event.preventDefault();  // Prevent default form submission
        
                // Add console logs to identify which input field is null
                const productTitleInput = document.getElementById('productTitle');
                const descriptionInput = document.getElementById('description');
                const industryInput = document.getElementById('industry');
                const businessTypeInput = document.getElementById('businessType');
                const problemsSolvedInput = document.getElementById('problemsSolved');
                const launchDateInput = document.getElementById('launchDate');
                const revenueCurrentYearInput = document.getElementById('revenueCurrentYear');
                const profitCurrentYearInput = document.getElementById('profitCurrentYear');
                const revenuePreviousYearInput = document.getElementById('revenuePreviousYear');
                const profitPreviousYearInput = document.getElementById('profitPreviousYear');
                const revenueYearBeforeInput = document.getElementById('revenueYearBefore');
                const profitYearBeforeInput = document.getElementById('profitYearBefore');
                const customersInput = document.getElementById('customers');
                const competitorsInput = document.getElementById('competitors');
        
                // Check each input and log if it's null
                if (!productTitleInput) console.error("Product Title input not found");
                if (!descriptionInput) console.error("Description input not found");
                if (!industryInput) console.error("Industry input not found");
                if (!businessTypeInput) console.error("Business Type input not found");
                if (!problemsSolvedInput) console.error("Problems Solved input not found");
                if (!launchDateInput) console.error("Launch Date input not found");
                if (!revenueCurrentYearInput) console.error("Revenue Current Year input not found");
                if (!profitCurrentYearInput) console.error("Profit Current Year input not found");
                if (!revenuePreviousYearInput) console.error("Revenue Previous Year input not found");
                if (!profitPreviousYearInput) console.error("Profit Previous Year input not found");
                if (!revenueYearBeforeInput) console.error("Revenue Year Before input not found");
                if (!profitYearBeforeInput) console.error("Profit Year Before input not found");
                if (!customersInput) console.error("Customers input not found");
                if (!competitorsInput) console.error("Competitors input not found");
        
                // Ensure all inputs are available before proceeding
                if (!productTitleInput || !descriptionInput || !industryInput || !businessTypeInput ||
                    !problemsSolvedInput || !launchDateInput || !revenueCurrentYearInput || 
                    !profitCurrentYearInput || !revenuePreviousYearInput || !profitPreviousYearInput || 
                    !revenueYearBeforeInput || !profitYearBeforeInput || !customersInput || 
                    !competitorsInput) {
                    console.error("One or more form elements are missing.");
                    return;  // Exit the function if any input is missing
                }
        
                // Get form data
                const formData = {
                    productTitle: productTitleInput.value,
                    description: descriptionInput.value,
                    industry: industryInput.value,
                    businessType: businessTypeInput.value,
                    problemsSolved: problemsSolvedInput.value,
                    launchDate: launchDateInput.value,
                    revenueCurrentYear: revenueCurrentYearInput.value,
                    profitCurrentYear: profitCurrentYearInput.value,
                    revenuePreviousYear: revenuePreviousYearInput.value,
                    profitPreviousYear: profitPreviousYearInput.value,
                    revenueYearBefore: revenueYearBeforeInput.value,
                    profitYearBefore: profitYearBeforeInput.value,
                    customers: customersInput.value,
                    competitors: competitorsInput.value,
                };
        
                // Send form data via fetch API
                fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        console.log('Success:', data);
                        resetForm();
                        renderProducts();
                    } else {
                        console.error('Error:', data);
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                });
            });
        });
        
        function resetForm() {
            document.getElementById('productForm').reset();  // Reset the form fields
            document.querySelector('.submit-button').textContent = "Add Product";  // Reset the button text
        }
        
        
        
        function showForm() {
            document.getElementById('plusButton').style.display = 'none';
            document.getElementById('smallPlusButton').style.display = 'none';
            document.getElementById('entryForm').style.display = 'block';
            document.getElementById('productList').style.display = 'none';
        }

        function resetForm() {
            document.getElementById('productForm').reset();  // Reset the form fields
            document.querySelector('.submit-button').textContent = "Add Product";  // Reset the button text
        }

        function renderProducts() {
            const productList = document.getElementById('productList');
            productList.innerHTML = '';  // Clear the list

            products.forEach((product, index) => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-header">Product ${index + 1}</div>
                    <div class="product-name">${product.productTitle}</div>
                    <div class="divider"></div>
                    <div class="row">
                        <div class="col-md-6">
                            <p><span class="section-title">Description:</span></p>
                            <p>${product.description}</p>
                            <p><span class="section-title">Industry / Sector:</span></p>
                            <p>${product.industry}</p>
                            <p><span class="section-title">Type of Business:</span></p>
                            <p>${product.businessType}</p>
                            <p><span class="section-title">Problems Solved:</span></p>
                            <p>${product.problemsSolved}</p>
                        </div>
                        <div class="col-md-6">
                            <p><span class="section-title">Launch Date:</span></p>
                            <p>${new Date(product.launchDate).toLocaleDateString()}</p>
                            <p><span class="section-title">Three Year Revenue & Profit:</span></p>
                            <p>Current Year (YTD):</p>
                            <p>Revenue = ${product.revenueCurrentYear} | P/L = ${product.profitCurrentYear}</p>
                            <p>Previous Year:</p>
                            <p>Revenue = ${product.revenuePreviousYear} | P/L = ${product.profitPreviousYear}</p>
                            <p>A year before:</p>
                            <p>Revenue = ${product.revenueYearBefore} | P/L = ${product.profitYearBefore}</p>
                            <p><span class="section-title">Customers:</span></p>
                            <p>${product.customers}</p>
                            <p><span class="section-title">Competitors:</span></p>
                            <p>${product.competitors}</p>
                        </div>
                    </div>
                    <div class="card-buttons">
                        <button class="btn btn-warning edit-button" onclick="editProduct(${index})">Edit</button>
                        <button class="btn btn-danger delete-button" onclick="deleteProduct(${index})">Delete</button>
                    </div>
                `;
                productList.prepend(productCard);  // Add the product card to the beginning
            });

            if (products.length > 0) {
                document.getElementById('smallPlusButton').style.display = 'block';
                document.getElementById('plusButton').style.display = 'none';
                document.getElementById('productList').style.display = 'block';
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% include './company_profile.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 20px;
        }
        .big-plus-button {
            font-size: 3rem;
            color: black;
            text-align: center;
            cursor: pointer;
            display: block;
            margin: 100px auto;
        }
        .table-container {
            margin-top: 20px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: center;
            padding: 10px;
            vertical-align: middle;
            border-bottom: 1px solid black; /* Border between rows */
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        td {
            word-wrap: break-word; /* Allow cell content to wrap */
            white-space: normal; /* Ensure long content wraps to the next line */
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, .05);
        }
        .form-control {
            border: none;
            background-color: transparent !important;
            text-align: center;
            box-shadow: none !important;
        }
        .form-control:focus {
            background-color: transparent !important;
            outline: none;
            box-shadow: none !important;
        }
        .add-row-button, .edit-button, .delete-button {
            cursor: pointer;
            font-size: 1.25rem;
        }
        .main-content {
            margin-left: 230px;
            /* Adjust according to sidebar width */
            padding: 40px;
            /* Reduce padding for a cleaner look */
            transition: margin-left 0.3s;
            /* Smooth transition for sidebar width changes */
        
            /* Reduce padding for a cleaner look */
            height: calc(100vh);
            /* Full height minus header/footer or any other elements */
            overflow-y: auto;
            /* Enable vertical scrolling if content exceeds height */
        
        }
    </style>
</head>
<body>

<div class="container main-content">
    <div id="bigPlusButton" class="big-plus-button" onclick="showTable()">+ Add Table</div>

    <div id="tableContainer" class="table-container">
        <table id="capTable" class="table table-striped">
            <thead>
                <tr>
                    <th>Ask</th>
                    <th>Value</th>
                    <th>Equity Share</th>
                    <th>Details</th>
                    <th class="actions">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows will be added here dynamically -->
            </tbody>
        </table>
        <div class="text-center mt-3">
            <span class="add-row-button" onclick="showEntryRow()">+ Add Row</span>
        </div>
    </div>
</div>

<script>
    let rows = [];
    let editIndex = -1;

    function showTable() {
        document.getElementById('bigPlusButton').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'block';
        showEntryRow();
    }

    function showEntryRow() {
        const tableBody = document.getElementById('tableBody');
        const entryRow = document.createElement('tr');

        entryRow.innerHTML = `
            <td><input type="text" class="form-control" id="askInput"></td>
            <td><input type="text" class="form-control" id="valueInput"></td>
            <td><input type="text" class="form-control" id="equityShareInput"></td>
            <td><input type="text" class="form-control" id="detailsInput"></td>
            <td><button class="btn btn-primary btn-sm" onclick="saveRow()">Add</button></td>
        `;

        tableBody.appendChild(entryRow);
    }

    function saveRow() {
        const ask = document.getElementById('askInput').value;
        const value = document.getElementById('valueInput').value;
        const equityShare = document.getElementById('equityShareInput').value;
        const details = document.getElementById('detailsInput').value;

        const row = {
            ask,
            value,
            equityShare,
            details
        };

        if (editIndex === -1) {
            rows.push(row);
        } else {
            rows[editIndex] = row;
            editIndex = -1;
        }

        renderRows();
    }

    function renderRows() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = ''; // Clear existing rows

        rows.forEach((row, index) => {
            const newRow = document.createElement('tr');
            newRow.id = `row-${index}`; // Set a unique ID for each row
            newRow.innerHTML = `
                <td>${row.ask}</td>
                <td>${row.value}</td>
                <td>${row.equityShare}</td>
                <td>${row.details}</td>
                <td class="actions">
                    <span class="edit-button" onclick="editRow(${index})">&#9998;</span>
                    <span class="delete-button" onclick="deleteRow(${index})">&#10060;</span>
                </td>
            `;
            tableBody.appendChild(newRow);
        });
    }

    function deleteRow(index) {
        rows.splice(index, 1);
        renderRows();
    }

    function editRow(index) {
        editIndex = index; // Set the index of the product being edited
        const row = rows[index];
        
        // Select the row to edit
        const tableRow = document.getElementById(`row-${index}`);
        
        // Replace the row's content with input fields containing the current values
        tableRow.innerHTML = `
            <td><input type="text" class="form-control" value="${row.ask}"></td>
            <td><input type="text" class="form-control" value="${row.value}"></td>
            <td><input type="text" class="form-control" value="${row.equityShare}"></td>
            <td><input type="text" class="form-control" value="${row.details}"></td>
            <td>
                <button class="btn btn-primary btn-sm" onclick="saveEditedRow(${index})">Save Changes</button>
                <button class="btn btn-secondary btn-sm" onclick="cancelEdit(${index})">Cancel</button>
            </td>
        `;
    }

    function saveEditedRow(index) {
        const tableRow = document.getElementById(`row-${index}`);
        
        // Retrieve the updated values from the input fields
        const updatedRow = {
            ask: tableRow.cells[0].querySelector('input').value,
            value: tableRow.cells[1].querySelector('input').value,
            equityShare: tableRow.cells[2].querySelector('input').value,
            details: tableRow.cells[3].querySelector('input').value
        };

        // Update the row in the `rows` array
        rows[index] = updatedRow;
        
        // Re-render the table to reflect the changes
        renderRows();
    }

    function cancelEdit(index) {
        // Re-render the table without making changes
        renderRows();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
